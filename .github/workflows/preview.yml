name: Publish branch preview

on:
  push:
    branches-ignore:
      - master
      - gh-pages

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: branch-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Create preview path
        id: preview
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          branch_slug="$(printf '%s' "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g; s/-\{2,\}/-/g; s/^-//; s/-$//')"
          preview_path="${branch_slug}-${RUN_NUMBER}"
          preview_url="https://${OWNER}.github.io/${REPOSITORY}/${preview_path}/"
          echo "path=${preview_path}" >> "$GITHUB_OUTPUT"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/${{ steps.preview.outputs.path }}/
        run: npm run build

      - name: Publish preview without replacing the production site
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ steps.preview.outputs.path }}
          keep_files: true

      - name: Report preview URL
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: echo "Preview URL: ${PREVIEW_URL}"

      - name: Comment preview URL on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const { data: pullRequests } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });

            if (pullRequests.length === 0) {
              core.info(`No open pull request found. Preview URL: ${process.env.PREVIEW_URL}`);
              return;
            }

            const body = `<!-- branch-preview -->\nBranch preview: ${process.env.PREVIEW_URL}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pullRequests[0].number,
            });
            const existingComment = comments.find((comment) => comment.body?.includes('<!-- branch-preview -->'));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequests[0].number,
                body,
              });
            }
